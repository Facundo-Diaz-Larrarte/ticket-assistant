research_meta:
  dataset_name: Ticket Assistant - Cuarteto Cordoba historical research
  research_date: '2026-08-17'
  scope: Shows 2025-2026, foco Q' Lokura y DesaKTa2; contraste con La Konga, Euge Quevedo/LBC, La Mona Jimenez y Luck Ra.
  methodology:
  - Priorizar ticketera oficial, sitio oficial del artista, venue/productora y prensa reconocida.
  - No inferir sale_start_at ni hours_to_sold_out sin timestamps publicamente verificables.
  - Usar null para datos no demostrables.
  - Distinguir CONFIRMED, CONFIRMED_SERIES, PARTIAL y UNKNOWN.
  - Excluir eventos cancelados/reprogramados del backtest de demanda salvo tratamiento especifico.
  quality_scale:
    CONFIRMED: Evidencia directa para el evento/campo concreto.
    CONFIRMED_SERIES: El evento pertenece a una serie expresamente documentada como agotada; no se recupero un post individual
      de sold-out.
    PARTIAL: Hay evidencia util pero no suficiente para fijar el valor exacto.
    UNKNOWN: No se encontro evidencia suficientemente defendible.
  important_note: hours_to_sold_out debe calcularse solo cuando sale_start_at y sold_out_at sean timestamps verificables.
    En esta version se preserva null en vez de inventar valores.
