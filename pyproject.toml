[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-assistant"
version = "0.1.0"
description = "Local ticket monitoring, discovery & purchase preparation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "playwright>=1.44.0",
    "rich>=13.7.1",
    "python-telegram-bot>=21.1.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0"
]
